[mod-setting-name]
people-hate-me-gore=Gore
people-hate-me-exploding-bottles=Exploding bottles

[mod-setting-description]
people-hate-me-gore=When people die, flesh is thrown from their bodies. Turn this off to keep only the blood.
people-hate-me-exploding-bottles=Thrown bottles burn in the air and burst into a fireball where they land, instead of just smashing. Only the look changes: they do the same damage.
